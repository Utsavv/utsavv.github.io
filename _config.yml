# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Utsav
middle_name:
last_name: Verma
email: utsav.verma@outlook.in
description: >
  Utsav Verma — AI Architect & Senior Database Architect with 21+ years building
  data platforms, applied AI, LLM/RAG systems, and SQL Server at scale. 2 AI patents filed.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: Utsav Verma, AI Architect, AI Solutions Architect, Database Architect, SQL Server, data architecture, applied AI, LLM, RAG, vector search, data platforms, DataOps, performance tuning
lang: en
timezone: "Asia/Kolkata"
icon: 🗄️

url: https://utsavverma.github.io
baseurl: ""
last_updated: false
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: false

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------

rss_icon: true

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
bib_search: false

max_width: 800px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image: https://utsavverma.github.io/assets/img/og-image.png

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: utsavv
linkedin_username: utsavverma
x_username: utsavverma
stackoverflow_id: "2941322/uvdata"

contact_note: >
  Feel free to reach out via LinkedIn or email for collaboration, speaking opportunities, or consulting.

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

# Google Analytics 4: replace the placeholder with your real Measurement ID
# (Admin → Data Streams → your web stream → "Measurement ID", looks like G-XXXXXXXXXX),
# then keep enable_google_analytics: true. Until then it stays a no-op placeholder.
google_analytics: G-XXXXXXXXXX
enable_google_analytics: true

# Search Console / Bing verification: paste the content token from the
# "HTML tag" verification method, then flip the matching enable_* flag to true.
google_site_verification:
enable_google_verification: false
bing_site_verification:
enable_bing_verification: false

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Utsav Verma
blog_description: Notes on databases, performance, architecture, and AI
permalink: /blog/:year/:title/
lsi: false

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"
  title: ":title - page :num"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

related_blog_posts:
  enabled: true
  max_related: 5

# Announcements / news
announcements:
  enabled: false
  scrollable: true
  limit: 5

latest_posts:
  enabled: true
  scrollable: true
  limit: 3

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: false
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

sass:
  style: compressed

# Defaults for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Utsav Verma"
      comments: false
      seo_type: "article"

# Plugins
plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-link-attributes
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-toc

# Archives
jekyll-archives:
  enabled: [year, tags, categories]
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: "/blog/:year/"
    tag: "/blog/tag/:name/"
    category: "/blog/category/:name/"

# External links
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:
    - "utsavverma.github.io"

