# -----------------------------------------------------------------------------
# Includes & Excludes
# -----------------------------------------------------------------------------

include: ["_pages"]

exclude:
  - readme.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - purgecss.config.js
  - robots.txt
  - sitemap.xml
