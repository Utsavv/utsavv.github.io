title: "Utsav Verma"
description: "Senior Database Architect — SQL Server, Data Platforms, AI"
url: "https://utsavverma.github.io" # Update if deploying under a custom domain
baseurl: "" # For user/organization pages, keep empty
lang: "en"
timezone: "Asia/Kolkata"

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

# Defaults for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Utsav Verma"
      comments: false
      seo_type: "article"

# Site-wide variables (edit as needed)
author:
  name: "Utsav Verma"
  email: "utsav.verma@outlook.in"
  location: "India"
  role: "Senior Database Architect"
  summary: "Architecting reliable data platforms, SQL Server performance, and AI-driven data systems."

# Optional default social preview image for Open Graph/Twitter cards.
# Keep empty unless a valid image exists under /assets/images.
social_image: ""

social:
  linkedin: "https://www.linkedin.com/in/utsavverma"
  twitter: "https://x.com/utsavverma"
  github: "https://github.com/utsavv"
  stackoverflow: "https://stackoverflow.com/users/2941322/uvdata"

# Exclude build artifacts
exclude:
  - README.md
  - readme.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
